name: "Server Deployment"
on:
  push:
    branches:
      - feature/deployment
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install dependencies
        run: |
          go mod download
          go mod verify
      - name: Run tests
        run: go test -v ./tests
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/automatic-charging:latest .
      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/automatic-charging:latest
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: "Deploy to Render"
        run: |
          curl --request POST\
          --url https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys \
              --header 'accept: application/json' \
              --header 'authorization: Bearer ${{ secrets.RENDER_TOKEN }}' \
              --header 'content-type: application/json' \
              --data '{
            "clearCache": "do_not_clear",
            "imageUrl": "${{ secrets.DOCKERHUB_USERNAME }}/automatic-charging:latest",
          }'
